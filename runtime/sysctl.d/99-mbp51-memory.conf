# 8 GB RAM, 4 GB maximum logical zram swap.
vm.swappiness = 100
vm.page-cluster = 0
# Standard zram companions. Compressed swap holds a large slice of RAM, so the
# allocator must not compensate by reclaiming and boosting aggressively; the
# visible stalls under memory pressure come from here, not from zram.
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
