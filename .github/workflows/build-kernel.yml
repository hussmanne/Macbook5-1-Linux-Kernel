name: Build experimental MBP5,1 kernel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source.lock'
      - 'scripts/**'
      # The independent DKMS test must not trigger a 20-minute kernel rebuild.
      - '!scripts/check-broadcom-dkms.sh'
      - 'runtime/**'
      - '.github/workflows/build-kernel.yml'
permissions:
  contents: read
concurrency:
  group: mbp51-kernel-build
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h .
      - name: Build with upstream pacman-pkg in Arch container
        run: |
          docker run --rm --pull=always -v "$PWD:/work" -w /work archlinux:base-devel bash -euc '
            pacman -Syu --noconfirm --needed git curl bc bison flex cpio libelf openssl pahole kmod rsync perl python gettext zstd
            useradd -m -u 1000 builder
            mkdir -p /work/.work /work/dist
            chown -R builder:builder /work/.work /work/dist
            su builder -s /bin/bash -c "cd /work && bash scripts/build.sh"
          '
      - name: Verify package checksums and build manifests
        run: |
          ls -lah dist/
          bash scripts/verify-artifacts.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: mbp51-kernel-and-headers
          path: dist/
          if-no-files-found: error
          retention-days: 30
