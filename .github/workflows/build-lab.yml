name: Build independent MacBookPro5,1 Extreme Lab kernel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source.lock'
      - 'patches/lab.lock'
      - 'scripts/tier-profile.sh'
      - 'scripts/build.sh'
      - 'scripts/configure.sh'
      - 'scripts/audit-config.sh'
      - 'scripts/check-kconfig.sh'
      - 'scripts/verify-artifacts.sh'
      - 'compat/broadcom/**'
      - '.github/workflows/build-lab.yml'
permissions:
  contents: read
concurrency:
  group: mbp51-extreme-lab-kernel
  cancel-in-progress: true
jobs:
  compile-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h .
      - uses: actions/cache@v4
        with:
          path: .cache/kconfig
          key: mbp51-linux-source-${{ hashFiles('source.lock') }}
      - name: Compile feature-preserving Extreme Lab kernel and headers
        run: |
          docker run --rm --pull=always -v "$PWD:/work" -w /work archlinux:base-devel bash -euc '
            pacman -Syu --noconfirm --needed git curl bc bison flex cpio libelf openssl pahole kmod rsync perl python gettext zstd
            useradd -m -u 1000 builder
            mkdir -p /work/.work /work/dist/lab
            chown -R builder:builder /work/.work /work/dist
            su builder -s /bin/bash -c "cd /work && MBP51_TIER=lab bash scripts/build.sh"
          '
      - name: Verify Lab provenance, recovered features and package ABI
        run: |
          MBP51_TIER=lab bash scripts/verify-artifacts.sh dist/lab
          grep -Fxq 'kernel_tier=lab' dist/lab/build-manifest.txt
          grep -Fxq 'pkgbase=linux-mbp51-extreme-lab' dist/lab/build-manifest.txt
          grep -Fxq 'CONFIG_HZ_250=y' dist/lab/resolved.config
          grep -Fxq 'CONFIG_HZ=250' dist/lab/resolved.config
          grep -Fxq 'CONFIG_USER_NS=y' dist/lab/resolved.config
          grep -Fxq 'CONFIG_MEMCG=y' dist/lab/resolved.config
          grep -Fxq 'CONFIG_PSI=y' dist/lab/resolved.config
          grep -Fxq 'CONFIG_BTRFS_FS_POSIX_ACL=y' dist/lab/resolved.config
          grep -Eq '^CONFIG_SND_HDA_CODEC_REALTEK=(m|y)$' dist/lab/resolved.config
      - uses: actions/upload-artifact@v4
        with:
          name: mbp51-extreme-lab-kernel-and-headers
          path: dist/lab/
          if-no-files-found: error
          retention-days: 30
