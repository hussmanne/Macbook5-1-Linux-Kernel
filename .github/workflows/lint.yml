name: Static validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit repository scripts and source lock
        run: |
          bash scripts/lint.sh
          bash scripts/test-verify-artifacts.sh
          bash -n install/activate-endeavouros-kernel.sh

  kconfig:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore pinned upstream archive cache
        uses: actions/cache@v4
        with:
          path: .cache/kconfig
          key: mbp51-linux-source-${{ hashFiles('source.lock') }}
      - name: Resolve pinned upstream Kconfig and enforce hardware/security contract
        run: |
          mkdir -p .cache/kconfig
          docker run --rm --pull=always \
            -v "$PWD:/work:ro" \
            -v "$PWD/.cache/kconfig:/kernel-source-cache" \
            -w /work -e MBP51_CACHE_DIR=/kernel-source-cache \
            archlinux:base-devel bash -euc '
              pacman -Syu --noconfirm --needed curl bc bison flex
              bash scripts/check-kconfig.sh
              MBP51_TIER=daily bash scripts/check-kconfig.sh
              MBP51_TIER=bore bash scripts/check-kconfig.sh
              MBP51_TIER=lab bash scripts/check-kconfig.sh
            '
