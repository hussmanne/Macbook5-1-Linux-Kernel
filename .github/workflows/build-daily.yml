name: Build independent MacBookPro5,1 Daily kernel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/tier-profile.sh'
      - 'scripts/build.sh'
      - 'scripts/configure.sh'
      - 'scripts/audit-config.sh'
      - 'scripts/verify-artifacts.sh'
      - 'compat/broadcom/build-on-device.sh'
      - '.github/workflows/build-daily.yml'
permissions:
  contents: read
concurrency:
  group: mbp51-daily-kernel
  cancel-in-progress: true
jobs:
  compile-daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h .
      - name: Restore pinned source cache
        uses: actions/cache@v4
        with:
          path: .cache/kconfig
          key: mbp51-linux-source-${{ hashFiles('source.lock') }}
      - name: Compile unique Daily kernel/headers packages
        run: |
          docker run --rm --pull=always -v "$PWD:/work" -w /work archlinux:base-devel bash -euc '
            pacman -Syu --noconfirm --needed git curl bc bison flex cpio libelf openssl pahole kmod rsync perl python gettext zstd
            useradd -m -u 1000 builder
            mkdir -p /work/.work /work/dist/daily
            chown -R builder:builder /work/.work /work/dist
            su builder -s /bin/bash -c "cd /work && MBP51_TIER=daily bash scripts/build.sh"
          '
      - name: Verify Daily binary provenance and package ABI
        run: |
          MBP51_TIER=daily bash scripts/verify-artifacts.sh dist/daily
          grep -Fxq 'kernel_tier=daily' dist/daily/build-manifest.txt
          grep -Fxq 'pkgbase=linux-mbp51-daily' dist/daily/build-manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mbp51-daily-kernel-and-headers
          path: dist/daily/
          if-no-files-found: error
          retention-days: 30
